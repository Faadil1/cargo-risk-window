name: CI

on:
  push:
    branches:
      - main
      - build/intermodal-ledger
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/cargo-risk-window-vite.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cargo-risk-window-vite.log
          exit 1
      - name: Install Chromium
        run: npx -y playwright@latest install chromium
      - name: Capture rendered QA
        run: |
          mkdir -p qa-artifacts
          npx -y playwright@latest screenshot --viewport-size="1440,900" --wait-for-timeout=1600 http://127.0.0.1:4173 qa-artifacts/desktop-1440x900.png
          npx -y playwright@latest screenshot --viewport-size="390,844" --wait-for-timeout=1200 --full-page http://127.0.0.1:4173 qa-artifacts/mobile-390x844.png
      - name: Upload rendered QA
        uses: actions/upload-artifact@v4
        with:
          name: rendered-qa
          path: qa-artifacts/
          if-no-files-found: error
